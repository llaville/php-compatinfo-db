---
name: StructArmed

on:
    workflow_call:
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onworkflow_callinputs
        inputs:
            operating-system:
                description: "OS name and version runtime"
                required: false
                default: "ubuntu-24.04"
                type: string
            php-version:
                description: "PHP runtime version in format Major.minor"
                required: false
                default: "8.2"
                type: string
            composer-options:
                description: "Composer options for ramsey/composer-install GitHub Action"
                required: false
                default: "--prefer-dist --no-scripts"
                type: string

permissions:
    contents: read

jobs:
    architecture:
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os:
                    - ${{ inputs.operating-system }}
                php:
                    - ${{ inputs.php-version }}

        steps:
            -   # https://github.com/actions/checkout
                name: Checkout
                uses: actions/checkout@v7.0.1
                with:
                    # Make sure the value of GITHUB_TOKEN will not be persisted in repo's config
                    persist-credentials: false

            -   # https://github.com/shivammathur/setup-php
                name: Setup PHP runtime
                uses: shivammathur/setup-php@2.37.2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: "none"

            -   # https://github.com/ramsey/composer-install
                name: Install Composer dependencies
                uses: ramsey/composer-install@4.0.0
                with:
                    dependency-versions: "highest"
                    composer-options: ${{ inputs.composer-options }}

            -
                name: Architecture enforcement with StructArmed
                run: vendor/bin/structarmed analyse --no-progress
